paths:
  asdd: datasets/Dataset2.v2-defect-classification.coco
  aircraftsurface: datasets/aircraftsurface1.v1i.coco
  agdd: datasets/AGDD-main
  imdd_aircraft_images: datasets/0to4_aircraft_skin4000pics
  imdd_aircraft_csv: datasets/0-4aircraft4000.csv
  # Reviewed detector annotations only. The directory is ignored unless it
  # contains a REVIEWED marker plus COCO/VOC/YOLO/LabelMe annotations.
  imdd_localization: datasets/imdd_localization_reviewed
  # Optional model-mined images that a person has confirmed are defect-free.
  hard_negatives: data/hard_negatives/reviewed
  # Optional CSV: image plus any of aircraft_id, tail_number, engine_id,
  # blade_id, inspection_session, video_id, camera_id, location_id, split.
  group_manifest: datasets/aerosafe_group_manifest.csv
  aebad: datasets/AeBAD/AeBAD
  bladesynth: datasets/Dataset_bladesynth
  external_iisc: data/iisc_aircraft_skin
  processed: data/processed
  checkpoints: checkpoints
  reports: reports
  artifacts: artifacts
  database: data/aeroinspect.sqlite3
  inspections: data/inspections

aircraft_labels:
  crack: [crack, cracks]
  dent: [dent, dents, contusion]
  scratch: [scratch, scratches]
  paint_damage: [paint-off, paint off, paint peel, paint peeling, paint_damage, paint damage]
  missing_fastener: [missing-head, missing head, missing fastener, missing-fastener, missing rivet, missing-rivet, missing bolt]
  corrosion: [corrosion, corroded]
  surface_damage: [dent scratch or paint falling, defect]

dataset:
  split_seed: 42
  split: {train: 0.70, validation: 0.15, test: 0.15}
  # The public sources use overlapping class definitions (for example the
  # broad ASDD surface-damage label overlaps dent, scratch, and paint damage).
  # New experiments first solve the defensible task: localize any defect.
  aircraft_task: binary
  binary_defect_label: defect
  near_duplicate_hamming: 6
  corrosion_min_examples: 30
  class_balance_max_sampling_weight: 4.0
  derivative_stem_patterns: ['_aug\d+$', '_copy\d*$', '_flip$', '_rot\d+$', '_resized$', '-aug\d+$']
  require_review_marker: true

aircraft:
  training_annotations_override: null  # Winner-only sliced-training ablation; validation/test stay fixed.
  # The deployed checkpoint remains unchanged until a candidate wins on the
  # frozen test set. Candidate runs never overwrite it.
  pretrained_model: SenseTime/deformable-detr
  checkpoint: checkpoints/aircraft_best
  primary_transformer: rt_detr_v2
  transformer_candidates:
    deformable_detr:
      pretrained_model: SenseTime/deformable-detr
      checkpoint: checkpoints/aircraft_candidates/deformable_detr
      image_size: 800
    rt_detr:
      pretrained_model: PekingU/rtdetr_r50vd
      checkpoint: checkpoints/aircraft_candidates/rt_detr
      image_size: 640
    rt_detr_v2:
      pretrained_model: PekingU/rtdetr_v2_r50vd
      checkpoint: checkpoints/aircraft_candidates/rt_detr_v2
      image_size: 640
  # Twenty fine-tuning epochs are enough for the first fair pretrained-model
  # comparison; non-improving models should not consume another 40 epochs.
  epochs: 20
  warmup_epochs: 2
  validation_interval: 5
  batch_size: 2
  learning_rate: 0.00002
  backbone_learning_rate: 0.000002
  weight_decay: 0.0001
  confidence_threshold: 0.50
  gradient_accumulation: 2
  max_grad_norm: 0.1
  image_size: 800
  auxiliary_pretrain_epochs: 3
  tiled_inference:
    enabled: true
    tile_size: 512
    overlap: 128
    nms_iou: 0.45
    min_image_size: 768
  small_defect_crop_probability: 0.35

engine:
  model: mmr
  checkpoint: checkpoints/engine_best.pt
  bladesynth_checkpoint: checkpoints/engine_bladesynth_best.pt
  teacher_backbone: wide_resnet50_2.tv2_in1k
  mae_backbone: vit_base_patch16_224.mae
  image_size: 224
  mask_ratio: 0.40
  # Deterministic unmasked evaluation; no ignored mask-count setting.
  # Match the published AeBAD-S MMR optimization recipe before comparing
  # alternative anomaly transformers.
  epochs: 200
  warmup_epochs: 50
  batch_size: 16
  learning_rate: 0.001
  weight_decay: 0.05
  validation_fraction: 0.20
  # 0.995 on the previous 52-image validation set effectively selected its
  # maximum score and caused very low sensitivity.
  normal_threshold_quantile: 0.95
  anomaly_threshold: null
  pixel_threshold: null
  auxiliary_pretrain_epochs: 5
  aebad_v_frame_stride: 10
  bladesynth_expected_images_per_class: 2500

baselines:
  faster_rcnn:
    checkpoint: checkpoints/faster_rcnn_best.pt
    epochs: 20
    validation_interval: 5
    batch_size: 2
    learning_rate: 0.005
    momentum: 0.9
    weight_decay: 0.0005
  patchcore:
    checkpoint: checkpoints/patchcore_best.pt
    batch_size: 8
    coreset_fraction: 0.10
    max_patches: 50000
    projection_dim: 128

training:
  evaluate_test_after_training: false
  seed: 42
  num_workers: 4
  mixed_precision: true
  checkpoint_every: 1
  # Training stops between epochs early enough to package a resumable archive
  # before Kaggle's 12-hour session limit.
  max_session_hours: 11.0
  artifact_reserve_minutes: 45
  quarter_count: 4
  one_go_max_epochs: 20
  tensorboard: true
  # Null stores runs under <reports>/tensorboard/{smoke|full}/<model>.
  tensorboard_log_dir: null

quality:
  minimum_width: 128
  minimum_height: 128
  blur_variance_warning: 35.0
  dark_mean_warning: 25.0
  bright_mean_warning: 235.0

app:
  save_history: true
  max_upload_mb: 15
  batch_size: 4
